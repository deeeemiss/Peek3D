# Loader regression tests: valid files open, broken ones fail cleanly, a window
# recovers after a bad file, and a short glTF fuzz run finds no crash.
name: Tests

on:
  push:
    branches: [main]
    paths: ["Peek3D/**", "Peek3D.xcodeproj/**", "tests/**", "testmodels/**", "scripts/test.py", ".github/workflows/test.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version
      - run: python3 scripts/test.py
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-files
          path: build/test/failures/
          if-no-files-found: ignore
