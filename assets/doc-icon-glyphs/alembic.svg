<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Alembic</title>
  <!-- A flask/vial — a literal nod to the format's name (an alembic is a
       distillation vessel) and a fitting shape for a "baked cache" of
       simulated/animated geometry. The only organic, curved silhouette in
       the set. -->
  <path d="M13,4 L19,4 L19,12 C19,12 25,14 26,20 C27,25 22,29 16,29 C10,29 5,25 6,20 C7,14 13,12 13,12 Z"
        fill="#A6D4FF" stroke="#1E5FA8" stroke-width="1.8" stroke-linejoin="round"/>
  <ellipse cx="16" cy="23" rx="8" ry="4.5" fill="#59ADFF"/>
</svg>
