name = "peek3d-licensing"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# --- Non-secret configuration -----------------------------------------
# Override per environment with `wrangler deploy --var KEY:value` or by
# editing this block. None of these are sensitive.
[vars]
POLAR_API_BASE = "https://api.polar.sh"
POLAR_ORGANIZATION_ID = "7f3f54b3-470d-4704-be44-4d1e7e53b319"
POLAR_LICENSE_KEYS_BENEFIT_ID = "bff08b35-a6a8-4aba-84a9-9f64987e8104"
POLAR_PRODUCT_ID = "b3ad1438-ccfd-43b0-af78-65b9865e724d"
RESEND_FROM_EMAIL = "Peek3D <licenze@peek3d.app>"

# --- Secrets (never in this file, never in git) -------------------------
# Set each with:
#   wrangler secret put POLAR_WEBHOOK_SECRET
#   wrangler secret put POLAR_ACCESS_TOKEN
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put LICENSE_ED25519_PRIVATE_KEY
#
# See README.md "Configuration" for what each one is and how to generate it.

# --- Rate limiting for /recover -----------------------------------------
# Cloudflare's native Rate Limiting binding. As of this writing it's
# configured via an "unsafe" binding block (API may have graduated to a
# first-class [[ratelimits]] table by the time this deploys -- check
# `wrangler docs ratelimit` / the Workers Rate Limiting API docs and adjust
# if the syntax below is rejected). If this binding is entirely unavailable
# on your account, do NOT ship without an alternative (Durable Object
# limiter) -- removing rate limiting on /recover turns it into an email
# enumeration oracle.
[[unsafe.bindings]]
name = "RECOVER_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
